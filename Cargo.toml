[package]
name = "claude-agents"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Lists Claude Code subagents on disk and flags which ones were invoked recently"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
ratatui = "0.30.2"
unicode-width = "0.2.2"
walkdir = "2"

[profile.release]
strip = true

# Sin optimizar, la primera pasada por el historial (~1 GB) tarda ~15 s en
# `make run`; con opt-level 1 se queda cerca de release y el debug sigue rápido.
[profile.dev]
opt-level = 1
